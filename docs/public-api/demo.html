<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shaka · Interactive Test Bench</title>
  <style>
    :root { color-scheme: dark; --ink:#f6f4ff; --muted:#aaa6bd; --panel:#171622; --line:#302d42; --violet:#8b72ff; --cyan:#59dfd2; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; background:radial-gradient(circle at 10% 0,#2a2058 0,transparent 36%),#0d0c13; color:var(--ink); }
    main { max-width:1180px; margin:auto; padding:56px 24px 72px; }
    header { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; margin-bottom:34px; }
    .eyebrow { color:var(--cyan); text-transform:uppercase; font-size:12px; letter-spacing:.18em; font-weight:800; }
    h1 { font-size:clamp(38px,6vw,74px); letter-spacing:-.055em; line-height:.95; margin:12px 0; max-width:760px; }
    .lede { max-width:720px; color:var(--muted); font-size:17px; line-height:1.65; }
    .pill { padding:10px 14px; border:1px solid var(--line); border-radius:999px; color:var(--muted); white-space:nowrap; }
    .grid { display:grid; grid-template-columns:minmax(320px,.82fr) minmax(0,1.18fr); gap:18px; }
    .card { background:linear-gradient(180deg,rgba(255,255,255,.035),transparent),var(--panel); border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:0 20px 70px rgba(0,0,0,.25); }
    label { display:block; color:var(--muted); font-size:12px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; margin:16px 0 7px; }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:12px; background:#0f0e17; color:var(--ink); padding:12px 13px; font:inherit; }
    textarea { min-height:105px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
    button { width:100%; margin-top:18px; border:0; border-radius:14px; padding:14px; background:linear-gradient(135deg,var(--violet),#6850e7); color:white; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 10px 30px rgba(113,87,255,.3); }
    button:disabled { opacity:.55; cursor:wait; }
    .button-row { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
    .button-row button { margin-top:0; background:#232033; border:1px solid #403a5a; box-shadow:none; }
    .result-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .status { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:7px 10px; font-size:12px; color:var(--muted); }
    pre { min-height:520px; max-height:700px; overflow:auto; margin:0; border-radius:14px; background:#0a0910; border:1px solid #262334; padding:18px; color:#d9d4ff; font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
    .facts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
    .fact { background:#100f18; border:1px solid var(--line); border-radius:12px; padding:11px; }
    .fact b { display:block; font-size:16px; margin-top:4px; }
    .fact span { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    nav a { color:var(--muted); text-decoration:none; margin-left:18px; font-size:14px; }
    nav a:hover { color:white; }
    @media (max-width:820px) { header,.grid { grid-template-columns:1fr; } nav { display:none; } .facts { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">Hardware-independent evaluation surface</div>
      <h1>Shaka Test Bench</h1>
      <p class="lede">用同一份契约检验任务输入、保护边界、动作计划、独立评估与证据留存。公共结果明确标注为仿真，不伪装成真实 G1 实验。</p>
    </div>
    <nav><a href="index.html">文档</a><a href="https://github.com/v6582374-netizen/Shaka">源码</a></nav>
  </header>
  <section class="grid">
    <form class="card" id="form">
      <div class="pill">单次调用 · 零机器人写入</div>
      <label for="endpoint">API 地址</label>
      <input id="endpoint" value="" placeholder="http://127.0.0.1:8787" />
      <label for="scenario">测试场景</label>
      <select id="scenario">
        <option value="nominal">标准任务 · nominal</option>
        <option value="shifted_base">基座变化 · shifted_base</option>
        <option value="target_occluded">目标遮挡 · target_occluded</option>
        <option value="guardian_absent">保护拒绝 · guardian_absent</option>
      </select>
      <label for="instruction">任务意图</label>
      <textarea id="instruction">定位黄色按钮，以右手食指触碰一次，随后撤离。</textarea>
      <label>初始基座状态</label>
      <div class="row">
        <input id="x" type="number" step="0.01" value="0" aria-label="base x metres" />
        <input id="y" type="number" step="0.01" value="0" aria-label="base y metres" />
        <input id="yaw" type="number" step="1" value="0" aria-label="base yaw degrees" />
      </div>
      <label for="seed">确定性种子</label>
      <input id="seed" type="number" min="0" value="7" />
      <button id="run" type="submit">运行一次完整闭环</button>
      <div class="button-row">
        <button id="loadEvidence" type="button">读取已留存案例</button>
        <button id="replayEvidence" type="button">重放两轮计划</button>
      </div>
    </form>
    <article class="card">
      <div class="result-head"><div><div class="eyebrow">Structured evidence</div><h2 style="margin:6px 0 0">调用结果</h2></div><span class="status" id="status">等待调用</span></div>
      <div class="facts">
        <div class="fact"><span>task result</span><b id="taskResult">—</b></div>
        <div class="fact"><span>physical execution</span><b id="physical">—</b></div>
        <div class="fact"><span>lifecycle phases</span><b id="phases">—</b></div>
      </div>
      <pre id="output">选择场景后运行。若从 GitHub Pages 访问，请先启动本地 API 或使用 Codespaces 转发地址。</pre>
    </article>
  </section>
</main>
<script>
  const endpoint = document.querySelector('#endpoint');
  endpoint.value = location.port === '8787' ? location.origin : 'http://127.0.0.1:8787';
  const form = document.querySelector('#form');
  const apiRoot = () => endpoint.value.replace(/\/$/,'');
  const render = (data, statusText) => {
    document.querySelector('#output').textContent = JSON.stringify(data,null,2);
    document.querySelector('#taskResult').textContent = data.task_result || data.round_two?.decision || data.rounds?.map(item => item.decision).join(' → ') || data.error?.code || 'loaded';
    document.querySelector('#physical').textContent = String(data.execution?.physical_execution ?? data.physical_execution ?? '—');
    document.querySelector('#phases').textContent = data.trace?.length ?? data.rounds?.length ?? '—';
    document.querySelector('#status').textContent = statusText;
  };
  const scenario = document.querySelector('#scenario');
  scenario.addEventListener('change', () => {
    const shifted = scenario.value === 'shifted_base';
    document.querySelector('#x').value = shifted ? '0.18' : '0';
    document.querySelector('#y').value = shifted ? '-0.08' : '0';
    document.querySelector('#yaw').value = shifted ? '12' : '0';
  });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = document.querySelector('#run');
    const status = document.querySelector('#status');
    button.disabled = true; status.textContent = '运行中…';
    const body = {
      mode:'simulation', scenario:scenario.value,
      instruction:document.querySelector('#instruction').value,
      seed:Number(document.querySelector('#seed').value),
      guardian_present:scenario.value !== 'guardian_absent',
      initial_state:{base_x_m:Number(document.querySelector('#x').value),base_y_m:Number(document.querySelector('#y').value),base_yaw_deg:Number(document.querySelector('#yaw').value)}
    };
    try {
      const response = await fetch(apiRoot() + '/v1/invocations', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data = await response.json();
      render(data, response.ok ? 'HTTP 200 · 完成' : `HTTP ${response.status}`);
    } catch (error) {
      document.querySelector('#output').textContent = `无法连接 API：${error.message}\n\n启动命令：\npython3 -m submission_api.server --host 127.0.0.1 --port 8787`;
      status.textContent = '连接失败';
    } finally { button.disabled = false; }
  });
  const evidenceAction = async (button, path, options, runningText) => {
    button.disabled = true;
    document.querySelector('#status').textContent = runningText;
    try {
      const response = await fetch(apiRoot() + path, options);
      const data = await response.json();
      render(data, response.ok ? `HTTP 200 · ${path.endsWith('replay') ? '重放完成' : '案例已读取'}` : `HTTP ${response.status}`);
    } catch (error) {
      document.querySelector('#output').textContent = `无法连接 API：${error.message}\n\nGitHub Pages 只提供静态界面；请配置本地 API 或 Codespaces 转发地址。`;
      document.querySelector('#status').textContent = '连接失败';
    } finally { button.disabled = false; }
  };
  document.querySelector('#loadEvidence').addEventListener('click', event => evidenceAction(event.currentTarget, '/v1/qwen/evidence', {}, '读取中…'));
  document.querySelector('#replayEvidence').addEventListener('click', event => evidenceAction(event.currentTarget, '/v1/qwen/replay', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}, '重放中…'));
</script>
</body>
</html>
