name: "Manual Build"

on:
  workflow_dispatch:

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete previous build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactNames = new Set([
              'skills-manager-macos-aarch64',
              'skills-manager-macos-x64',
              'skills-manager-ubuntu-22.04',
              'skills-manager-windows-latest',
            ]);

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            const targets = artifacts.filter((artifact) => artifactNames.has(artifact.name));
            core.info(`Found ${targets.length} historical artifacts to delete.`);

            for (const artifact of targets) {
              core.info(`Deleting artifact ${artifact.id} (${artifact.name}) created at ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

  build-tauri:
    needs: cleanup-artifacts
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            artifact_name: "skills-manager-macos-aarch64"
            artifact_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
          - platform: "macos-15-intel" # Intel Mac (Native x64 runner)
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
            artifact_name: "skills-manager-macos-x64"
            artifact_paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
          - platform: "ubuntu-22.04"
            args: ""
            rust_target: ""
            artifact_name: "skills-manager-ubuntu-22.04"
            artifact_paths: |
              src-tauri/target/release/bundle/**/*.AppImage
              src-tauri/target/release/bundle/**/*.deb
          - platform: "windows-latest"
            args: ""
            rust_target: ""
            artifact_name: "skills-manager-windows-latest"
            artifact_paths: |
              src-tauri/target/release/bundle/**/*.exe
              src-tauri/target/release/bundle/**/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: install create-dmg
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm ci

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Skills Manager v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          retention-days: 1
          if-no-files-found: error
